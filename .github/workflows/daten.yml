name: Börsenpreise und Solarertrag holen

# Startet bei Änderung an lauf/daten_anstoss.env (oder von Hand). Holt Börsenpreise der letzten 12 Monate
# (Energy-Charts) und Solarertrag je Bundesland (PVGIS) nach daten/ und committet sie.
on:
  schedule:
    # Day-Ahead-Preise für morgen stehen gegen 13 Uhr MEZ fest: ein Lauf am Tag (Festlegung Nutzer 06.11.2026), 12:47 UTC = 13:47 MEZ
    - cron: "47 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/daten_anstoss.env]

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: true

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          # Zeitplan: nur die Börsenpreise holen (kein Solar, keine Regelenergie); von Hand oder per Anstoß: alles
          NUR_BOERSE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python daten/holen.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten/boerse_*.json daten/solar_je_land.json daten/regelenergie.json
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Börsenpreise und Solarertrag aktualisiert (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
