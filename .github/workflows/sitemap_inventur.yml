name: Sitemap-Inventur aller Netzbetreiber-Websites

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/sitemap_inventur.env]

permissions:
  contents: write

concurrency:
  group: sitemap-inventur

jobs:
  inventur:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python daten/sitemap_inventur.py
      - name: Committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnis/sitemap_inventur.csv ergebnis/sitemap_kandidaten.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Sitemap-Inventur (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
