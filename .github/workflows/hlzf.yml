name: Hochlastzeitfenster laden und lesen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/hlzf.env]

permissions:
  contents: write

concurrency:
  group: hlzf

jobs:
  hlzf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: python daten/hlzf_holen.py
      - name: Committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnis/hlzf_ergebnis.csv ergebnis/hlzf_texte 2>/dev/null || true
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Hochlastzeitfenster (Lauf ${{ github.run_id }})"
          git checkout -- .
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
