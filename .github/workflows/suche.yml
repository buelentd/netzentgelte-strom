name: Such-Schlüssel testen

# Prüft nur, ob der Schlüssel für die Such-Schnittstelle (Brave Search) funktioniert: wenige Abfragen,
# Treffer werden im Protokoll gezeigt, nichts wird gespeichert oder committet. Die eigentliche Suche
# läuft im großen Lauf "Netzentgelte Strom" direkt vor dem Auslesen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/suche_anstoss.env]

permissions:
  contents: read

concurrency:
  group: netzentgelte-suche
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python-Pakete
        run: pip install -r requirements.txt

      - name: Schlüssel testen
        env:
          SUCHE_SCHLUESSEL: ${{ secrets.SUCHE_SCHLUESSEL }}
        run: |
          if [ -z "$SUCHE_SCHLUESSEL" ]; then
            echo "::error::Repository-Secret SUCHE_SCHLUESSEL ist leer (Settings > Secrets and variables > Actions > Repository secrets)"
            exit 1
          fi
          python - <<'PY'
          import os, sys
          from vnb.suche import _abrufen, abfrage, links
          gesamt = 0
          for name in ["Stadtwerke Elmshorn", "Avacon Netz", "Stadtwerke Waren"]:
              q = abfrage(name, 2026)
              t = links(_abrufen(os.environ["SUCHE_SCHLUESSEL"], q))
              gesamt += len(t)
              print(f"{q}: {len(t)} Treffer")
              for u in t[:5]:
                  print("   ", u)
          print("Schlüssel funktioniert" if gesamt else "Schlüssel angenommen, aber keine Treffer")
          PY
