name: vnbdigital.de Websites der Problemfälle prüfen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/vnbdigital_websites.env]

permissions:
  contents: write

concurrency:
  group: vnbdigital-websites

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vnbdigital-client==0.4.14
      - run: python daten/vnbdigital_websites.py
      - run: python daten/vnbdigital_websites.py treffer
      - name: Committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/vnbdigital_websites.json daten/vnbdigital_treffer.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "vnbdigital: Websites der Problemfälle (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
