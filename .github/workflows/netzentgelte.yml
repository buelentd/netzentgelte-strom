name: Netzentgelte Strom

on:
  workflow_dispatch:
    inputs:
      jahr:
        description: "Jahr der Preisblätter"
        required: true
        default: "2026"
      limit:
        description: "Anzahl offener Netzbetreiber in diesem Lauf (leer = alle)"
        required: false
        default: ""
      worker:
        description: "parallel bearbeitete Websites"
        required: true
        default: "8"
      wiederholen:
        description: "Status erneut bearbeiten, z. B. blockiert,kein_preisblatt (leer = keine)"
        required: false
        default: ""
      liste_neu:
        description: "Netzbetreiber-Liste neu aus dem MaStR laden"
        type: boolean
        default: false
      diagnose:
        description: "Textauszüge der geladenen Dokumente auf den Branch diagnose legen"
        type: boolean
        default: true
  # Start ohne Formular: Änderung an lauf/anstoss.env auf main pushen (Einstellungen stehen in der Datei)
  push:
    branches: [main]
    paths: [lauf/anstoss.env]

permissions:
  contents: write

concurrency:
  group: netzentgelte
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Einstellungen
        id: p
        env:
          EREIGNIS: ${{ github.event_name }}
          IN_JAHR: ${{ inputs.jahr }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_WORKER: ${{ inputs.worker }}
          IN_WIEDERHOLEN: ${{ inputs.wiederholen }}
          IN_LISTE_NEU: ${{ inputs.liste_neu }}
          IN_DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          if [ "$EREIGNIS" = "push" ]; then
            # nur KEY=wert-Zeilen übernehmen, nichts ausführen
            while IFS='=' read -r k v; do
              case "$k" in JAHR|LIMIT|WORKER|WIEDERHOLEN|LISTE_NEU|DIAGNOSE|SUCHE_MAX|NEU_PRUEFEN|AUSLESEN|NUR_SUCHTREFFER) printf -v "IN_$k" '%s' "${v//[^A-Za-z0-9_,]/}";; esac
            done < lauf/anstoss.env
          fi
          {
            echo "jahr=${IN_JAHR:-2026}"
            echo "limit=$IN_LIMIT"
            echo "worker=${IN_WORKER:-8}"
            echo "wiederholen=$IN_WIEDERHOLEN"
            echo "liste_neu=${IN_LISTE_NEU:-false}"
            echo "diagnose=${IN_DIAGNOSE:-true}"
            echo "suche_max=${IN_SUCHE_MAX:-1000}"
            echo "neu_pruefen=$IN_NEU_PRUEFEN"
            echo "auslesen=${IN_AUSLESEN:-false}"
            echo "nur_suchtreffer=${IN_NUR_SUCHTREFFER:-false}"
          } | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Systempakete
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Python-Pakete und Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fortschritt aus vorherigem Lauf wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: |
            ergebnis/cache
            ergebnis/pdf
            ergebnis/fortschritt.jsonl
            ergebnis_2027/cache
            ergebnis_2027/pdf
            ergebnis_2027/fortschritt.jsonl
          key: netzentgelte-${{ steps.p.outputs.jahr }}-${{ github.run_id }}
          restore-keys: netzentgelte-${{ steps.p.outputs.jahr }}-

      - name: Fortschritt aus dem Repository hat Vorrang (Zwischenspeicher kann älter sein)
        run: git checkout -- ergebnis/fortschritt.jsonl ergebnis_2027/fortschritt.jsonl 2>/dev/null || git checkout -- ergebnis/fortschritt.jsonl

      - name: Tests
        run: python -m pytest -q tests

      - name: MaStR-Export aus vorherigem Lauf wiederherstellen
        id: mastr_cache
        if: steps.p.outputs.liste_neu == 'true' || hashFiles('ergebnis/netzbetreiber.csv') == ''
        uses: actions/cache/restore@v4
        with:
          path: mastr/xml_download
          key: mastr-export-${{ github.run_id }}
          restore-keys: mastr-export-

      - name: Netzbetreiber-Liste (MaStR)
        id: liste
        if: steps.p.outputs.liste_neu == 'true' || hashFiles('ergebnis/netzbetreiber.csv') == ''
        run: python run.py liste

      - name: MaStR-Export sichern (Cache)
        if: always() && steps.mastr_cache.outcome == 'success' && hashFiles('mastr/xml_download/**/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: mastr/xml_download
          key: mastr-export-${{ github.run_id }}

      - name: Preisblätter über Such-Schnittstelle finden
        if: ${{ steps.p.outputs.auslesen != 'true' }}
        continue-on-error: true
        env:
          SUCHE_SCHLUESSEL: ${{ secrets.SUCHE_SCHLUESSEL }}
        run: python run.py suche --jahr "${{ steps.p.outputs.jahr }}" --max-abfragen "${{ steps.p.outputs.suche_max }}"

      - name: Preisblätter suchen und auslesen
        timeout-minutes: 320
        run: >
          python run.py lauf --jahr "${{ steps.p.outputs.jahr }}" --worker "${{ steps.p.outputs.worker }}"
          ${{ steps.p.outputs.limit != '' && format('--limit "{0}"', steps.p.outputs.limit) || '' }}
          ${{ steps.p.outputs.wiederholen != '' && format('--wiederholen "{0}"', steps.p.outputs.wiederholen) || '' }}
          ${{ steps.p.outputs.neu_pruefen != '' && format('--neu "{0}"', steps.p.outputs.neu_pruefen) || '' }}
          ${{ steps.p.outputs.auslesen == 'true' && '--offline' || '' }}
          ${{ steps.p.outputs.nur_suchtreffer == 'true' && '--nur-hinweise' || '' }}

      - name: Bericht
        if: always()
        run: |
          if [ -f ergebnis/fortschritt.jsonl ] || [ -f ergebnis_2027/fortschritt.jsonl ]; then python run.py bericht --jahr "${{ steps.p.outputs.jahr }}"; fi
          if [ -f ergebnis/zusammenfassung.md ]; then cat ergebnis/zusammenfassung.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Diagnose (Textauszüge auf Branch diagnose)
        if: ${{ !cancelled() && steps.p.outputs.diagnose == 'true' }}
        run: |
          python run.py diagnose
          rm -rf "$RUNNER_TEMP/diag" && mkdir "$RUNNER_TEMP/diag" && cp -r diagnose/. "$RUNNER_TEMP/diag/"
          cd "$RUNNER_TEMP/diag"
          git init -q -b diagnose
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Diagnose Lauf ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnose

      - name: Fortschritt sichern (Cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ergebnis/cache
            ergebnis/pdf
            ergebnis/fortschritt.jsonl
            ergebnis_2027/cache
            ergebnis_2027/pdf
            ergebnis_2027/fortschritt.jsonl
          key: netzentgelte-${{ steps.p.outputs.jahr }}-${{ github.run_id }}

      - name: PDFs und Fortschritt als Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netzentgelte-${{ steps.p.outputs.jahr }}-${{ github.run_id }}
          path: |
            ergebnis/pdf
            ergebnis/fortschritt.jsonl
            ergebnis/lauf.log
          if-no-files-found: ignore
          retention-days: 30

      - name: SLP-Diagnose auf den frisch geladenen Dokumenten (nur wenn lauf/slp_diagnose.liste existiert)
        if: ${{ always() && hashFiles('lauf/slp_diagnose.liste') != '' }}
        continue-on-error: true
        run: python daten/slp_diagnose.py

      - name: Ergebnisse committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in "ergebnis/netzentgelte_${{ steps.p.outputs.jahr }}.csv" ergebnis/restliste.csv ergebnis/gefunden.csv ergebnis/nicht_gefunden.csv lauf/suche_erledigt.csv ergebnis/zusammenfassung.md \
                   ergebnis/netzbetreiber.csv ergebnis/plz_netzbetreiber.csv ergebnis/mastr_rollen.txt \
                   ergebnis/fortschritt.jsonl ergebnis/slp_diagnose.csv ergebnis/slp_diagnose ergebnis/texte \
                   ergebnis_2027/netzentgelte_2027.csv ergebnis_2027/restliste.csv ergebnis_2027/fortschritt.jsonl ergebnis_2027/zusammenfassung.md ergebnis_2027/hochlastzeitfenster_2027.csv; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Netzentgelte ${{ steps.p.outputs.jahr }}: Ergebnisse aktualisiert (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
