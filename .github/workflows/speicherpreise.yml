name: Speicherpreise sammeln

# Sammelt Preise in €/kWh für Gewerbespeicher aus Websuche (Brave), Fachmagazinen, Händlerseiten und Ratgebern.
# robots.txt beachtet, 1 Anfrage/s je Domain, Timeout 30 s. Funde sind "ungeprüft", bis sie am Original geprüft sind.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/speicherpreise.env]

permissions:
  contents: write

concurrency:
  group: speicherpreise

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install protego pdfplumber
      - name: Sammeln
        env:
          SUCHE_SCHLUESSEL: ${{ secrets.SUCHE_SCHLUESSEL }}
        run: |
          ABFRAGEN=$(sed -n 's/^ABFRAGEN=\([0-9]*\).*/\1/p' lauf/speicherpreise.env | head -1)
          SEITEN=$(sed -n 's/^SEITEN=\([0-9]*\).*/\1/p' lauf/speicherpreise.env | head -1)
          MODUS=$(sed -n 's/^MODUS=\([a-z0-9]*\).*/\1/p' lauf/speicherpreise.env | head -1)
          case "$MODUS" in
            auszuege)    python -m vnb.speicherpreise --auszuege ;;
            runde2)      python -m vnb.speicherpreise --runde 2 --abfragen "${ABFRAGEN:-32}" --seiten "${SEITEN:-250}" ;;
            runde3)      python -m vnb.speicherpreise --runde 3 --abfragen "${ABFRAGEN:-12}" --seiten "${SEITEN:-120}" ;;
            runde4)      python -m vnb.speicherpreise --runde 4 --seiten "${SEITEN:-120}" ;;
            runde6)      python -m vnb.speicherpreise --runde 6 ;;
            runde5)      python -m vnb.speicherpreise --runde 5 --abfragen "${ABFRAGEN:-33}" --seiten "${SEITEN:-200}" ;;
            aufschlaege) python -m vnb.aufschlaege --abfragen "${ABFRAGEN:-10}" --seiten "${SEITEN:-120}" ;;
            *)           python -m vnb.speicherpreise --abfragen "${ABFRAGEN:-10}" --seiten "${SEITEN:-150}" ;;
          esac
      - name: Committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d ergebnis/speicherpreise_pdftabellen ] && git add ergebnis/speicherpreise_pdftabellen
          for f in ergebnis/speicherpreise_funde.csv ergebnis/speicherpreise_auszuege.csv ergebnis/strompreis_aufschlaege_funde.csv ergebnis/speicherpreise_gesperrt.csv ergebnis/speicherpreise_verweise.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Speicherpreise: neue Funde (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
