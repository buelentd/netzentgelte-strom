name: Speicherpreise sammeln

# Sammelt Preise in €/kWh für Gewerbespeicher aus Websuche (Brave), Fachmagazinen, Händlerseiten und Ratgebern.
# robots.txt beachtet, 1 Anfrage/s je Domain, Timeout 30 s. Funde sind "ungeprüft", bis sie am Original geprüft sind.
on:
  schedule:
    - cron: "17 */6 * * *"     # Sicherheitsnetz: startet den Dauerlauf neu, falls die Kette abreißt
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/speicherpreise.env]

permissions:
  contents: write
  actions: write

concurrency:
  group: speicherpreise

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install protego pdfplumber
      - name: Sammeln
        env:
          SUCHE_SCHLUESSEL: ${{ secrets.SUCHE_SCHLUESSEL }}
        run: |
          ABFRAGEN=$(sed -n 's/^ABFRAGEN=\([0-9]*\).*/\1/p' lauf/speicherpreise.env | head -1)
          SEITEN=$(sed -n 's/^SEITEN=\([0-9]*\).*/\1/p' lauf/speicherpreise.env | head -1)
          MODUS=$(sed -n 's/^MODUS=\([a-z0-9]*\).*/\1/p' lauf/speicherpreise.env | head -1)
          if [ "${{ github.event_name }}" != "push" ]; then
            # Dauerlauf: Modus reihum nach Zahl der bisherigen Runden (lauf/speicherpreise_runden.log)
            MODI=(runde7 runde8 runde2 runde5)
            N=$( [ -f lauf/speicherpreise_runden.log ] && wc -l < lauf/speicherpreise_runden.log || echo 0 )
            MODUS=${MODI[$(( N % 4 ))]}
            ABFRAGEN=""; SEITEN=""
          fi
          echo "Modus: $MODUS"
          echo "$MODUS" > /tmp/modus.txt
          case "$MODUS" in
            auszuege)    python -m vnb.speicherpreise --auszuege ;;
            runde2)      python -m vnb.speicherpreise --runde 2 --abfragen "${ABFRAGEN:-32}" --seiten "${SEITEN:-250}" ;;
            runde3)      python -m vnb.speicherpreise --runde 3 --abfragen "${ABFRAGEN:-12}" --seiten "${SEITEN:-120}" ;;
            runde4)      python -m vnb.speicherpreise --runde 4 --seiten "${SEITEN:-120}" ;;
            runde7)      python -m vnb.produktseiten ;;
            runde8)      python -m vnb.produktseiten --chemie ;;
            runde6)      python -m vnb.speicherpreise --runde 6 ;;
            runde5)      python -m vnb.speicherpreise --runde 5 --abfragen "${ABFRAGEN:-33}" --seiten "${SEITEN:-200}" ;;
            aufschlaege) python -m vnb.aufschlaege --abfragen "${ABFRAGEN:-10}" --seiten "${SEITEN:-120}" ;;
            *)           python -m vnb.speicherpreise --abfragen "${ABFRAGEN:-10}" --seiten "${SEITEN:-150}" ;;
          esac
      - name: Committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d ergebnis/speicherpreise_pdftabellen ] && git add ergebnis/speicherpreise_pdftabellen
          mkdir -p lauf
          echo "$(date -u +%Y-%m-%dT%H:%MZ);${{ github.run_id }};${{ github.event_name }};$(cat /tmp/modus.txt 2>/dev/null);funde=$(wc -l < ergebnis/speicherpreise_funde.csv);produktfunde=$(wc -l < ergebnis/speicherpreise_produktfunde.csv);aufschlaege=$(wc -l < ergebnis/strompreis_aufschlaege_funde.csv)" >> lauf/speicherpreise_runden.log
          git add lauf/speicherpreise_runden.log
          for f in ergebnis/speicherpreise_funde.csv ergebnis/speicherpreise_auszuege.csv ergebnis/strompreis_aufschlaege_funde.csv ergebnis/speicherpreise_gesperrt.csv ergebnis/speicherpreise_verweise.csv ergebnis/speicherpreise_produktfunde.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Speicherpreise: neue Funde (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
      - name: Nächste Runde sofort starten (Dauerlauf)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          if grep -qi '^an' lauf/dauerlauf.txt 2>/dev/null; then
            gh workflow run speicherpreise.yml --ref "${GITHUB_REF_NAME}" && echo "nächste Runde angestoßen"
          else
            echo "Dauerlauf aus (lauf/dauerlauf.txt)"
          fi
