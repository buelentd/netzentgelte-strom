name: SLP-Diagnose (ohne Internet, nur Zwischenspeicher)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/slp_diagnose.env]

permissions:
  contents: write

concurrency:
  group: slp-diagnose

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - name: Zwischenspeicher wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: |
            ergebnis/cache
            ergebnis/pdf
          key: netzentgelte-2026-diagnose-${{ github.run_id }}
          restore-keys: netzentgelte-2026-
      - run: python daten/slp_diagnose.py
      - name: Committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnis/slp_diagnose.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "SLP-Diagnose (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
