name: Netztransparenz (Zugang prüfen)

# Startet bei Änderung an lauf/netztransparenz.env. Modus pruefen: zeigt gesetzte Secret-Namen (ja/nein), meldet sich an,
# listet die angebotenen Datensätze. Werte der Secrets werden nie ausgegeben.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/netztransparenz.env]

permissions:
  contents: write

concurrency:
  group: netztransparenz
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prüfen
        env:
          NETZ_TRANSPARENZ_ID: ${{ secrets.NETZ_TRANSPARENZ_ID }}
          NETZ_TRANSPARENZ_API: ${{ secrets.NETZ_TRANSPARENZ_API }}
          NETZ_TRANSPARENZ_CLIENT_ID: ${{ secrets.NETZ_TRANSPARENZ_CLIENT_ID }}
          NETZ_TRANSPARENZ_CLIENTID: ${{ secrets.NETZ_TRANSPARENZ_CLIENTID }}
          NETZ_TRANSPARENZ_SECRET: ${{ secrets.NETZ_TRANSPARENZ_SECRET }}
          NETZ_TRANSPARENZ_CLIENT_SECRET: ${{ secrets.NETZ_TRANSPARENZ_CLIENT_SECRET }}
          NETZ_TRANSPARENZ_KEY: ${{ secrets.NETZ_TRANSPARENZ_KEY }}
          NETZ_TRANSPARENZ: ${{ secrets.NETZ_TRANSPARENZ }}
          NETZTRANSPARENZ_CLIENT_ID: ${{ secrets.NETZTRANSPARENZ_CLIENT_ID }}
          NETZTRANSPARENZ_CLIENT_SECRET: ${{ secrets.NETZTRANSPARENZ_CLIENT_SECRET }}
          NTP_CLIENT_ID: ${{ secrets.NTP_CLIENT_ID }}
          NTP_CLIENT_SECRET: ${{ secrets.NTP_CLIENT_SECRET }}
          NETZTRANSPARENZ: ${{ secrets.NETZTRANSPARENZ }}
        run: |
          MODUS=$(sed -n 's/^MODUS=\([a-z]*\).*/\1/p' lauf/netztransparenz.env | head -1)
          python daten/netztransparenz.py "${MODUS:-pruefen}"
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/ntp_negative_preise.csv daten/ntp_afrr_aktiviert.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Netztransparenz-Daten aktualisiert (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
