name: FCR-Preise von regelleistung.net

# Startet bei Änderung an lauf/regelleistung.env (MODUS=test oder MODUS=jahr). Test zeigt nur den Aufbau im Protokoll.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lauf/regelleistung.env]

permissions:
  contents: write

concurrency:
  group: regelleistung
  cancel-in-progress: true

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Abrufen
        run: |
          MODUS=$(sed -n 's/^MODUS=\([a-z]*\).*/\1/p' lauf/regelleistung.env | head -1)
          python daten/regelleistung.py "${MODUS:-test}"
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/fcr_roh.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "FCR-Preise aktualisiert (Lauf ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
